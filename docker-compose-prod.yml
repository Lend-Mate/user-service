networks:
  lendmate-net:
    external: true

services:
  user-service:
    image: "user-service"
    build: .
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db
      SPRING_DATASOURCE_USERNAME: lendmate
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xmx150m -Xms96m"
    restart: unless-stopped
    networks:
      - lendmate-net

volumes:
  postgres_data: