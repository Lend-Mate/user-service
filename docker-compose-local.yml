networks:
  lendmate-net:
    external: true

services:
  user-service:
    image: "user-service"
    build: .
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db_dev
      SPRING_DATASOURCE_USERNAME: lendmate
      SPRING_DATASOURCE_PASSWORD: lendmate
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped
    networks:
      - lendmate-net

volumes:
  postgres_data: