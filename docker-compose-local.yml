services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: lendmate
      POSTGRES_PASSWORD: lendmate
      POSTGRES_DB: product_service_db_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
