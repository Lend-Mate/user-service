name: Build and Deploy Spring Boot App
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run Tests
        run: mvn test

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: SERVER_INFO
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: target/

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: |
          scp -i ~/.ssh/deploy_key target/*.jar root@${{ vars.SERVER_HOST }}:/opt/lendmate/user-service/
          scp -i ~/.ssh/deploy_key Dockerfile root@${{ vars.SERVER_HOST }}:/opt/lendmate/user-service/
          scp -i ~/.ssh/deploy_key docker-compose-prod.yml root@${{ vars.SERVER_HOST }}:/opt/lendmate/user-service/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ vars.SERVER_HOST }} << 'EOF'
            cd /opt/lendmate/user-service/
            docker compose -f docker-compose-prod.yml down app
            docker compose -f docker-compose-prod.yml build app
            docker compose -f docker-compose-prod.yml up -d app
          EOF